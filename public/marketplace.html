<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Marketplace · ReUseHub</title><link rel="stylesheet" href="/theme.css"></head><body><header class="topbar"><div class="wrap nav"><a href="/" class="brand"><span class="brand-mark">↗</span> ReUseHub</a><nav class="nav-links"><a href="/">Home</a><a href="/marketplace.html">Marketplace</a><a href="/dashboard.html">My dashboard</a></nav><div class="nav-actions"><button class="btn btn-light" id="accountBtn">Sign in</button><button class="btn btn-primary" id="sellBtn">＋ Sell an item</button></div></div></header><main class="wrap"><div class="page-title"><span class="eyebrow">The student marketplace</span><h1 style="font-size:clamp(2rem,4vw,3.3rem);margin-top:10px">Find your next good thing.</h1><p>Search campus finds and give useful things a second life.</p></div><div class="market-layout"><aside class="filters"><h3>Filter listings</h3><div class="filter-content"><div class="filter-group"><label for="q">Search</label><input id="q" class="field" placeholder="Books, calculator…"></div><div class="filter-group"><label for="category">Category</label><select id="category" class="field"><option value="">All categories</option></select></div><div class="filter-group"><label>Price range (₹)</label><div class="filter-row"><input id="min" class="field" type="number" min="0" placeholder="Min"><input id="max" class="field" type="number" min="0" placeholder="Max"></div></div><div class="filter-group"><label for="type">Listing type</label><select id="type" class="field"><option value="">All types</option><option value="sell">For sale</option><option value="exchange">Exchange</option><option value="free">Free</option></select></div><div class="filter-group"><label for="condition">Condition</label><select id="condition" class="field"><option value="">Any condition</option><option>New</option><option>Like New</option><option>Good</option><option>Fair</option></select></div></div><button class="btn btn-primary" id="applyFilters" style="width:100%;margin-top:15px">Apply filters</button><button class="btn btn-light" id="resetFilters" style="width:100%;margin-top:8px">Reset</button></aside><section><div class="toolbar"><div><strong id="resultCount">Latest listings</strong><div class="small muted" id="resultHint">Discover student finds</div></div><select id="sort" class="field" aria-label="Sort listings"><option value="newest">Newest first</option><option value="price_asc">Price: low to high</option><option value="price_desc">Price: high to low</option></select></div><div class="product-grid" id="results"><div class="empty" style="grid-column:1/-1">Loading listings…</div></div><div style="display:flex;justify-content:center;gap:10px;margin-top:24px"><button class="btn btn-light" id="prevPage">← Previous</button><span class="btn btn-light" id="pageLabel">Page 1</span><button class="btn btn-light" id="nextPage">Next →</button></div></section></div></main><footer class="footer"><div class="wrap footer-grid"><a href="/" class="brand"><span class="brand-mark">↗</span> ReUseHub</a><div class="footer-links"><a href="/help.html">Help & safety</a><a href="/terms.html">Terms</a><a href="/privacy.html">Privacy</a></div></div></footer><div id="modalRoot"></div><div id="toastRoot" aria-live="polite"></div><script src="/app.js"></script><script src="/marketplace.js"></script></body></html>
